name: Build iOS (IPA chưa ký)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID (phải khớp App ID trong provisioning profile của bạn)'
        required: true
        default: 'com.example.tapviethan'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Đặt Bundle ID
        env:
          BID: ${{ inputs.bundle_id }}
        run: |
          case "$BID" in *[!A-Za-z0-9.-]*|"") echo "Bundle ID không hợp lệ"; exit 1;; esac
          sed -i '' "s/com\.example\.tapviethan/$BID/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n PRODUCT_BUNDLE_IDENTIFIER ios/App/App.xcodeproj/project.pbxproj

      - name: Cài thư viện và đồng bộ web vào dự án iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Build (không ký)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói IPA
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry TapVietHan-unsigned.ipa Payload
          ls -la TapVietHan-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TapVietHan-unsigned-ipa
          path: TapVietHan-unsigned.ipa
