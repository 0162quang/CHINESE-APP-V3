name: Build iOS (IPA đã ký bằng chứng chỉ của bạn)

# Cần 3 secret trong Settings > Secrets and variables > Actions:
#   IOS_CERT_P12_BASE64  : file chứng chỉ .p12 đã mã hoá base64
#   IOS_CERT_PASSWORD    : mật khẩu của file .p12
#   IOS_PROFILE_BASE64   : file .mobileprovision đã mã hoá base64
# Tuỳ chọn:
#   IOS_BUNDLE_ID        : chỉ cần khi profile là wildcard (App ID dạng com.abc.*)
#   IOS_EXPORT_METHOD    : development | ad-hoc | enterprise | app-store (mặc định tự nhận từ profile)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
      BUNDLE_OVERRIDE: ${{ secrets.IOS_BUNDLE_ID }}
      METHOD_OVERRIDE: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện và đồng bộ web vào dự án iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Nạp chứng chỉ và provisioning profile
        run: |
          set -euo pipefail
          [ -n "$CERT_B64" ] && [ -n "$PROFILE_B64" ] || { echo "Thiếu secret IOS_CERT_P12_BASE64 hoặc IOS_PROFILE_BASE64"; exit 1; }
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENT=$(security find-identity -v -p codesigning "$KC" | awk '/[0-9A-F]{40}/{print $2; exit}')
          [ -n "$IDENT" ] || { echo "Không tìm thấy chứng chỉ ký hợp lệ trong file .p12"; exit 1; }

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true; }
          UUID=$(pb UUID); PNAME=$(pb Name); TEAM=$(pb TeamIdentifier:0)
          APPID=$(pb Entitlements:application-identifier); BUNDLE="${APPID#${TEAM}.}"
          [ -n "$BUNDLE_OVERRIDE" ] && BUNDLE="$BUNDLE_OVERRIDE"
          case "$BUNDLE" in *\**) echo "Profile là wildcard ($BUNDLE). Hãy đặt secret IOS_BUNDLE_ID, ví dụ com.abc.tapviethan"; exit 1;; esac
          if [ -n "$METHOD_OVERRIDE" ]; then METHOD="$METHOD_OVERRIDE"
          elif [ "$(pb ProvisionsAllDevices)" = "true" ]; then METHOD=enterprise
          elif [ "$(pb Entitlements:get-task-allow)" = "true" ]; then METHOD=development
          elif [ -n "$(pb ProvisionedDevices)" ]; then METHOD=ad-hoc
          else METHOD=app-store; fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Team=$TEAM Bundle=$BUNDLE Profile=$PNAME Method=$METHOD"
          { echo "IDENT=$IDENT"; echo "TEAM=$TEAM"; echo "BUNDLE=$BUNDLE"; echo "PNAME=$PNAME"; echo "METHOD=$METHOD"; } >> "$GITHUB_ENV"

      - name: Cấu hình ký cho target App
        run: |
          python3 - <<'PY'
          import os,re
          p='ios/App/App.xcodeproj/project.pbxproj'
          s=open(p,encoding='utf-8').read()
          assert s.count('CODE_SIGN_STYLE = Automatic;')>=2,'không tìm thấy cấu hình ký trong project'
          sign=('CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "%s";\n\t\t\t\tDEVELOPMENT_TEAM = %s;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";'
                %(os.environ['IDENT'],os.environ['TEAM'],os.environ['PNAME']))
          s=s.replace('CODE_SIGN_STYLE = Automatic;',sign)
          s=s.replace('com.example.tapviethan',os.environ['BUNDLE'])
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      - name: Xuất IPA
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PNAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath export -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          ls -la export

      - uses: actions/upload-artifact@v4
        with:
          name: TapVietHan-signed-ipa
          path: export/*.ipa
