<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Tập viết chữ Hán</title>
<style>
:root{--bg:#e8ece7;--panel:#f4f6f2;--ink:#17262b;--mute:#5d6b6e;--line:#c5cdc6;--acc:#2b3a8c;--acc-ink:#fff;--grid:#b9c3bd;--sel:#dbe1f3;--num:#2b3a8c;--ok:#2a7a4b;--bad:#a63a3a}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;height:calc(100% - var(--tab))}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{font-size:17px;font-weight:600;padding:16px 18px 8px}

.tabs button{font:inherit;font-size:13px;padding:7px 2px;border:0;border-radius:8px;background:none;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--sel);color:var(--ink);font-weight:600}
#side{padding:0 12px 12px;overflow-y:auto;flex:1}
select,input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;color:inherit;cursor:pointer;font:inherit}
.item:hover,.item.on{background:var(--sel)}
.item.on{box-shadow:inset 3px 0 0 var(--acc)}
.item .zh{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:21px;font-weight:500;min-width:3em;white-space:nowrap}
.item .mid{font-size:12.5px;color:var(--mute);line-height:1.3;overflow:hidden;flex:1}
.item .mid b{color:var(--ink);font-weight:500;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.dot.l{background:var(--acc)}.dot.m{background:var(--ok)}
main{padding:26px 36px;overflow-y:auto}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.head .py{font-size:26px;font-weight:500}.head .lv{font-size:12px;background:var(--sel);padding:2px 9px;border-radius:99px}
.mean{font-size:16px;margin:6px 0 2px;max-width:760px}.sub{color:var(--mute);font-size:13.5px;max-width:760px}
.stage{display:flex;flex-wrap:wrap;gap:14px;margin:20px 0 0}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:4px;position:relative;cursor:pointer;margin-bottom:26px}
.cell.sel{outline:2px solid var(--acc)}
.cell .gridsvg,.cell .tgt,.cell .ov{position:absolute;inset:0;width:100%;height:100%}.cell .ov{pointer-events:none}
.cell .cap{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:12px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
button.b{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer}
button.b:hover{border-color:var(--acc)}button.b.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.b.sm{padding:5px 12px;font-size:13px}
label.t{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.status{margin-top:12px;min-height:22px;color:var(--mute)}.status.ok{color:var(--ok);font-weight:500}
.hint{color:var(--mute);padding:10px 8px;font-size:13.5px}
.big{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:96px;line-height:1.2;text-align:center;margin:40px 0 10px}
.rate{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.rate button{min-width:120px}.rate small{display:block;color:var(--mute);font-weight:400}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 24px}.stats div{font-size:13px;color:var(--mute)}.stats b{display:block;font-size:26px;color:var(--ink);font-weight:500}
.card{max-width:760px;margin:0 auto;text-align:center}
.foot{margin-top:30px;font-size:12px;color:var(--mute);max-width:760px}
textarea{font:inherit;resize:vertical}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px}
.hubc{font:inherit;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.hubc:hover{border-color:var(--acc)}.hubc b{font-size:16px}.hubc span{color:var(--mute);font-size:13.5px}
.fl{display:block;margin:0 0 12px;font-size:13px;color:var(--mute)}.fl select{margin:4px 0 0}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mute);font-size:13px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}.pbar i{display:block;height:100%;background:var(--acc)}
.qp{font-size:22px;margin:30px 0 6px;min-height:60px}.qh{margin:20px 0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;text-align:left}
.opt{font:inherit;display:flex;gap:10px;align-items:center;padding:14px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;cursor:pointer;min-height:64px}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}
.opt kbd{font:12px/1 inherit;background:var(--sel);border-radius:5px;padding:4px 7px;color:var(--mute);flex:none}
.opt.zh span{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:26px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--panel))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;text-align:left;background:var(--panel);border-left:4px solid var(--ok)}.fb.bad{border-left-color:var(--bad)}
.fb .zh{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:26px;margin-right:10px}
.flipwrap{perspective:1200px;height:320px;margin:14px 0}
.flip{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;overflow:auto;text-align:center}
.face.back{transform:rotateY(180deg)}
.fhz{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:88px;line-height:1.2}
.fsm{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:28px;color:var(--mute)}
.fm{font-size:20px;margin:6px 0}.big2{font-size:26px}.face .py{font-size:28px;font-weight:500}
.wl{text-align:left;margin:14px 0}.wl div{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}.wl .zh{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:22px;min-width:3em}
.lesson{max-width:860px}.lhead .lno{color:var(--acc);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase}.lhead h1{margin:2px 0 4px;font-size:28px;font-weight:600}
.remind{margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--sel);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:13px}
.lesson h2{font-size:18px;margin:30px 0 10px;font-weight:600}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px}.gcard h3{margin:0 0 6px;font-size:16px}.gcard p{margin:6px 0}
.gex>div,.srow{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line)}
.gex .zh,.zh2{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:20px}
.gex .py,.dl .py,.srow .py{color:var(--acc);font-size:14px}.gex .vi,.dl .vi,.srow .vi{color:var(--mute);font-size:14px}
.dl{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.dl>b{width:22px;color:var(--mute);flex:none}.dl>div{flex:1}
.spk{border:0;background:var(--sel);color:var(--ink);border-radius:6px;cursor:pointer;margin-left:8px;font-size:12px;padding:2px 8px;vertical-align:middle}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wchip{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}.wchip:hover{border-color:var(--acc)}
.wchip .zh{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:22px;display:block}.wchip .py{color:var(--acc);font-size:12.5px;display:block}.wchip .vi{color:var(--mute);font-size:12.5px}
.srow{cursor:pointer;border-bottom:0}.cover .srow:not(.show) .zp{visibility:hidden}.srow .zp{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline}
.gl{display:block;width:100%;text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}.gl:hover{border-color:var(--acc)}.gl small{display:block;color:var(--mute);margin-top:2px}
html,body{height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
:root{--tab:calc(58px + env(safe-area-inset-bottom,0px))}
.app{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.tabs button{font-size:12px;padding:8px 0}
.back{display:none}
select,input[type=text],textarea{font-size:16px}
button{touch-action:manipulation}
body.quizzing .cell{touch-action:none}
.big{font-size:clamp(48px,18vw,96px)}
@media (max-width:820px){
 .app{display:block;position:relative;overflow:hidden}
 aside,main{position:absolute;top:0;left:0;right:0;bottom:0;border:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
 main{padding-left:16px;padding-right:16px;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .18s ease-out,visibility 0s linear .18s}
 body.detail main{transform:none;visibility:visible;transition:transform .18s ease-out,visibility 0s}
 body.detail aside{visibility:hidden;transition:visibility 0s linear .18s}

 .stage{gap:10px}
 .opts{grid-template-columns:1fr}.flipwrap{height:280px}.fhz{font-size:72px}.hub{grid-template-columns:1fr}
 .lesson h1{font-size:24px}.gex>div,.srow{flex-direction:column;gap:2px}.srow .vi{min-width:0!important}.wgrid{grid-template-columns:repeat(2,1fr)}
}
.wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.wz{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:30px}.wh .py{font-size:20px;font-weight:500}.wh .lv{font-size:12px;background:var(--sel);padding:2px 9px;border-radius:99px}
.padbox{display:flex;justify-content:center;margin:10px 0 6px;min-height:200px}
.pad{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;touch-action:pan-y;flex:none}.pad.quizzing{touch-action:none}
.pad .gridsvg,.pad .tgt,.pad .ov{position:absolute;inset:0;width:100%;height:100%}.pad .ov{pointer-events:none}
.chips{display:flex;gap:8px;justify-content:center;min-height:44px;margin:4px 0}
.chip{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:22px;min-width:48px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px}.chip.on{background:var(--sel);border-color:var(--acc)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}.ctl .b{min-height:48px;font-size:16px}
.status{height:24px;min-height:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.more{margin:8px 0}.more summary{color:var(--mute);cursor:pointer;padding:6px 0}.opr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 0}
body.feedmode main{padding:0;overflow:hidden}
.feed{height:100%;display:flex;flex-direction:column}
.ftop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.ftop select{margin:0;flex:1;min-width:0}.ftop span{font-size:13px;color:var(--mute);white-space:nowrap}
.fscroll{flex:1;min-height:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.fs{height:var(--fh,600px);scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 12px;box-sizing:border-box}
.fmeta{text-align:center}.fw{font-size:22px}.fw .py{font-size:18px;color:var(--acc)}.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.facts .b{min-height:44px}
.fst{width:100%;text-align:center}

:root{--r:20px;--rs:14px;--tab:calc(80px + env(safe-area-inset-bottom,0px))}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
#bgl{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}

aside{background:var(--bg);border-right:0}main{background:var(--bg)}
.brand{font-size:20px;font-weight:700;padding:18px 20px 8px}#side{padding:4px 14px 18px}

<aside><div class="brand">Tập viết chữ Hán</div>

<script src="lib/hanzi-writer.min.js"></script>
<script>
(async()=>{
document.getElementById('side').textContent='Đang tải dữ liệu…';
const EL=(typeof process!=='undefined'&&process.versions&&process.versions.electron)?{fs:require('fs'),path:require('path')}:null;
const getJSON=async rel=>{if(EL)return JSON.parse(EL.fs.readFileSync(EL.path.join(__dirname,rel),'utf8'));const r=await fetch(rel);if(!r.ok)throw new Error(rel);return r.json()};
const Pref=(()=>{try{return window.Capacitor&&Capacitor.registerPlugin?Capacitor.registerPlugin('Preferences'):null}catch(x){return null}})();
const ACC={indigo:['#4f5bd5','#9aa5ff'],teal:['#0f9b8e','#5fd3c6'],rose:['#e0386b','#ff8fb0'],amber:['#d97706','#fbbf24']};
const GRAD={mist:['Sương mai','linear-gradient(160deg,#dde8ff,#f3e4ff)'],mint:['Bạc hà','linear-gradient(160deg,#d7f5ea,#e3f0ff)'],peach:['Đào','linear-gradient(160deg,#ffe3d3,#ffe4f0)'],sand:['Cát','linear-gradient(160deg,#f1e7d0,#e9dcc0)'],dusk:['Hoàng hôn','linear-gradient(160deg,#3a3969,#7b4a7c)'],ocean:['Biển đêm','linear-gradient(160deg,#0e2a40,#13535e)']};
let UI={theme:'auto',acc:'indigo',bg:{t:'none'},sa:76,img:''};
const isDarkUI=()=>UI.theme==='dark'||(UI.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
const accHex=()=>{const a=ACC[UI.acc]||ACC.indigo;return isDarkUI()?a[1]:a[0]};
async function loadUI(){let raw=null;try{if(Pref)raw=(await Pref.get({key:'ui'})).value}catch(x){}if(!raw)try{raw=localStorage.getItem('ui')}catch(x){}let u=null;try{u=JSON.parse(raw)}catch(x){}u=u&&typeof u==='object'?u:{};
  const o={theme:['auto','light','dark'].includes(u.theme)?u.theme:'auto',acc:ACC[u.acc]?u.acc:'indigo',bg:u.bg&&['none','preset','image'].includes(u.bg.t)?u.bg:{t:'none'},sa:Math.min(96,Math.max(40,+u.sa||76)),img:''};
  if(o.bg.t==='preset'&&!GRAD[o.bg.v])o.bg={t:'none'};try{o.img=localStorage.getItem('bgimg')||''}catch(x){}if(o.bg.t==='image'&&!o.img)o.bg={t:'none'};return o}
function saveUI(){const j=JSON.stringify({theme:UI.theme,acc:UI.acc,bg:UI.bg,sa:UI.sa});try{localStorage.setItem('ui',j)}catch(x){}try{if(Pref)Pref.set({key:'ui',value:j}).catch(()=>{})}catch(x){}}

function hwRs(pts,k){
  if(pts.length===1)return Array(k).fill(pts[0]);
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=d[d.length-1]||1e-6,out=[];let j=1;
  for(let t=0;t<k;t++){const x=L*t/(k-1);while(j<pts.length-1&&d[j]<x)j++;const a=pts[j-1],b=pts[j],sg=d[j]-d[j-1]||1e-6,u=Math.min(1,Math.max(0,(x-d[j-1])/sg));out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}
  return out}
function hwNorm(strokes){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;strokes.forEach(s=>s.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}));
  const w=x1-x0,h=y1-y0,m=Math.max(w,h,1),cx=(x0+x1)/2,cy=(y0+y1)/2;
  return{s:strokes.map(st=>hwRs(st,6).map(p=>[(p[0]-cx)/m*100+50,(p[1]-cy)/m*100+50])),r:Math.min(10,Math.max(.1,w/Math.max(h,m*.06)))}}
function hwScore(d,c){
  const N=d.s.length,n=c.n;if(Math.abs(N-n)>1)return 9;
  const cs=[];for(let i=0;i<n;i++){const st=[];for(let k=0;k<6;k++)st.push([c.p[i*12+k*2],c.p[i*12+k*2+1]]);cs.push(st)}
  const dist=(a,b)=>{let t=0;for(let k=0;k<6;k++)t+=Math.hypot(a[k][0]-b[k][0],a[k][1]-b[k][1]);return t/6};
  let best=9e9;if(N===n){let t=0;for(let i=0;i<N;i++)t+=dist(d.s[i],cs[i]);best=t/N}
  const used=Array(n).fill(false);let t=0;
  for(let i=0;i<N;i++){let m=1e9,mj=-1;for(let j=0;j<n;j++)if(!used[j]){const v=dist(d.s[i],cs[j]);if(v<m){m=v;mj=j}}if(mj>=0){used[mj]=true;t+=m}else t+=40}
  t+=Math.max(0,n-N)*25;best=Math.min(best,t/Math.max(N,n)*1.12);
  return best/100+Math.min(.3,.12*Math.abs(Math.log2(d.r/c.r)))+.04*Math.abs(N-n)}

function makeQ(e,type,pool){

  const ct=textOf(e);if(!ct)return null;
  let c=shuf(pool.filter(x=>x!==e&&keyOf(x)!==keyOf(e)&&textOf(x)&&textOf(x)!==ct));
  if(type!=='h2m'){const L=len(e),same=c.filter(x=>len(x)===L),set=new Set(same);c=same.concat(c.filter(x=>!set.has(x)))}
  const seen=new Set([ct]),d=[];for(const x of c){const t=textOf(x);if(seen.has(t))continue;seen.add(t);d.push(x);if(d.length===3)break}
  return d.length<3?null:{e,type,opts:shuf([e,...d]).map(x=>({x,t:textOf(x),ok:x===e}))}}

  let pool=usable.slice();if(pool.length<20)pool=pool.concat(shuf(HSKPOOL).slice(0,300));
  const qs=[];for(const e of shuf(usable).slice(0,n)){const t=type==='mix'?['h2m','m2h','h2p'][Math.random()*3|0]:type;const q=makeQ(e,t,pool);if(q)qs.push(q)}

  const w=c.e,S=Math.max(180,Math.min(innerWidth-(narrow()?24:120),el.clientHeight-210,560));
  el.innerHTML='<div class="fmeta"><div class="fw"><span>'+esc(w[0])+'</span> <span class="py">'+esc(w[1])+'</span></div><div class="mean">'+esc(meaningOf(w))+'</div><div class="sub">'+(c.n>1?'Chữ '+(c.ix+1)+'/'+c.n+' của '+esc(w[0])+' · ':'')+cd(c.ch).strokes.length+' nét</div></div><div class="padbox" style="margin:0;min-height:0"></div>'
    +'<div class="facts"><button class="b" data-a="demo">▶ Mẫu</button><button class="b p" data-a="quiz">✍ Viết</button><button class="b" data-a="say">Nghe</button><button class="b" data-a="mine">'+(P.mine.includes(keyOf(w))?'♥ Đã lưu':'♡ Lưu')+'</button><button class="b" data-a="srs">+ Ôn</button></div><div class="status fst"></div>';
  const st=el.querySelector('.fst'),k=keyOf(w);
  const pad=newPad(el.querySelector('.padbox'),[c.ch],S,{st,onTap:()=>{pad.quiz();st.textContent='Viết từng nét vào ô'},onMistake:()=>{F.streak=0;feedCount()},onDone:m=>{F.streak=m===0?F.streak+1:0;feedCount();setTimeout(()=>{if(FEED===F&&F.act===i)feedGo(1)},900)}});
  if(!pad)return;F.mounted.set(i,pad);pad.demo(true);st.textContent='Chạm vào ô để tự viết';
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='demo'){pad.demo(true);st.textContent='Xem nét mẫu'}
    else if(a==='quiz'){pad.quiz();st.textContent='Viết từng nét vào ô'}
    else if(a==='say')say(w,st);
    else if(a==='mine'){const has=P.mine.includes(k);P.mine=has?P.mine.filter(x=>x!==k):P.mine.concat(k);if(!ENT.has(k))ENT.set(k,w);save();b.textContent=has?'♡ Lưu':'♥ Đã lưu'}
    else if(a==='srs'){if(!P.w[k])P.w[k]={d:today(),i:0,e:2.5,r:0};save();b.textContent='✓ Đã thêm'}})}
/* ---- chuyển tab ---- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{stopFeed();killPad();view=b.dataset.v;gen++;document.body.classList.remove('quizzing');document.body.classList.toggle('detail',view==='review'||view==='feed');renderSide();if(view==='review')reviewHub();else if(view==='feed')startFeed();else if(view==='learn'){if(gid!=='c'&&!narrow()){const it=$('#list')._items;showWord(cur&&it.some(x=>keyOf(x)===keyOf(cur))?cur:it[0])}else if(narrow())cur=null}else if(view==='search'){$('#main').innerHTML='<div class="sub" style="margin-top:40px">Tra bất kỳ từ nào trong kho từ điển gần 115.000 mục. Bấm vào kết quả để xem nét viết, nghĩa và Hán Việt.</div>';cur=null}else{$('#main').innerHTML='<div class="sub" style="margin-top:40px">Từ bạn tự lưu hoặc tự thêm nằm ở đây.</div>';cur=null}});
renderSide();if(!narrow())$('#main').innerHTML='<div class="sub" style="margin-top:40px">Tra từ ở khung bên trái. Bấm một từ để xem nét viết, nghĩa và từ ghép.</div>';
})().catch(err=>{document.getElementById('side').textContent='Lỗi tải dữ liệu: '+err.message});
</script></body></html>
