# Codemagic: build IPA CHƯA KÝ để bạn tự ký bằng chứng chỉ riêng.
# Cách chạy: Codemagic > chọn repo > Start new build > workflow "ios-unsigned".
workflows:
  ios-unsigned:
    name: Tập viết Hán - IPA chưa ký
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest        # Capacitor 8 cần Xcode 26 trở lên
      node: latest         # Capacitor 8 cần Node 22 trở lên
      vars:
        # Đổi thành App ID trong provisioning profile của bạn (hoặc để nguyên rồi để công cụ ký ghi đè).
        BUNDLE_ID: "app.snowleopard9698.strawberry6637"
    scripts:
      - name: Cài thư viện
        script: npm ci
      - name: Đặt Bundle ID
        script: |
          case "$BUNDLE_ID" in *[!A-Za-z0-9.-]*|"") echo "Bundle ID không hợp lệ"; exit 1;; esac
          sed -i '' "s/com\.example\.tapviethan/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n PRODUCT_BUNDLE_IDENTIFIER ios/App/App.xcodeproj/project.pbxproj
      - name: Đồng bộ web vào dự án iOS
        script: npx cap sync ios
      - name: Build Release (không ký)
        script: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Đóng gói IPA
        script: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry TapVietHan-unsigned.ipa Payload
          ls -la TapVietHan-unsigned.ipa
          # Kiểm tra nhanh: file thực thi phải là arm64 (iPhone XS Max dùng chip A12 = arm64)
          lipo -info "Payload/$(basename "$APP")/App" || true
    artifacts:
      - TapVietHan-unsigned.ipa
